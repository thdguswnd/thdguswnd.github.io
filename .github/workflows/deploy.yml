name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build (sm-fe)
        working-directory: sm-fe
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Bundle site artifacts
        run: |
          rm -rf _site
          mkdir -p _site/wedhome

          # 1. 기존 sm-fe 빌드 결과물 복사 (/game, /invite, /thankyou 등 유지)
          cp -r sm-fe/dist/* _site/

          # 2. /wedhome 경로에서도 열리도록 복사
          cp -r wedhome/* _site/wedhome/

          # 3. 최상위(/) 접속 시에도 wedhome 시뮬레이터가 뜨도록 루트 index.html 교체
          cp wedhome/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
