<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161a">
<title>사진 남기기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 왼쪽 필름 -->
  <div class="film" id="filmLeft" aria-label="업로드된 사진 (왼쪽)"></div>

  <!-- 가운데: ㅇ / 캐릭터 / 아래 -->
   <main class="center">
    <div class="road" id="road" aria-hidden="true"></div>
    <section class="center-top">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <nav class="menu" id="menuTop"></nav>
    </section>

    <section class="center-mid">
      <div id="character" aria-hidden="true">
        <img src="assets/character.gif" alt="">
      </div>
    </section>

    <section class="center-bottom">
      <nav class="menu" id="menuBottom"></nav>
      <button class="btn-upload" id="btnUpload" type="button">
        <span class="ico">＋</span><span>사진·영상 올리기</span>
      </button>
      <p class="hint" id="windowHint"></p>
    </section>
  </main>

  <!-- 오른쪽 필름 -->
  <div class="film" id="filmRight" aria-label="업로드된 사진 (오른쪽)"></div>
</div>

<!-- 정보 팝업 (작게) -->
<div class="overlay" id="infoOverlay" hidden>
  <div class="info-card" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <button class="x" type="button" data-close aria-label="닫기">✕</button>
    <h2 id="infoTitle"></h2>
    <div id="infoBody"></div>
  </div>
</div>

<!-- 업로드 팝업 (거의 전체 화면) -->
<div class="overlay" id="uploadOverlay" hidden>
  <div class="upload-card" role="dialog" aria-modal="true" aria-labelledby="upTitle">
    <header>
      <h2 id="upTitle">사진·영상 올리기</h2>
      <button class="x" type="button" data-close aria-label="닫기">✕</button>
    </header>
<div class="up-body">
      <button class="pick" id="btnPick" type="button">
        <span class="pick-ico">📷</span>
        <strong>휴대폰에서 파일 선택</strong>
        <small>여러 개를 한 번에 고를 수 있습니다</small>
      </button>
      <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden>
      <ul class="up-list" id="upList"></ul>
      <p class="up-note">올린 사진은 화면 양옆 필름에 표시됩니다. 동영상은 잘 저장되지만 필름에는 나오지 않습니다.</p>
    </div>
    <footer>
      <p class="up-summary" id="upSummary"></p>
      <div class="up-row">
        <input class="up-phone" id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel"
               maxlength="13" placeholder="010-0000-0000 (선택)" aria-label="휴대폰 번호 (선택)">
        <button class="btn-primary" id="btnStart" type="button" disabled>올리기</button>
      </div>
      <p class="up-privacy" id="phoneNotice"></p>
    </footer>
  </div>
</div>

<!-- 확대 보기 -->
<div class="overlay dark" id="viewOverlay" hidden>
  <div class="viewer" role="dialog" aria-modal="true" aria-label="사진 확대 보기">
    <button class="x light" type="button" data-close aria-label="닫기">✕</button>
    <div class="view-stage" id="viewStage"></div>
    <div class="view-actions" id="viewActions">
      <button class="btn-like" id="btnLike" type="button" aria-pressed="false">
        <span class="heart">♡</span><span>좋아요</span><span class="cnt" id="likeCount"></span>
      </button>
      <button class="btn-ghost" id="btnHide" type="button">이 사진 숨기기</button>
    </div>
    <div class="view-confirm" id="viewConfirm" hidden>
      <p>모든 사람 화면에서 이 항목을 숨깁니다.<br>숨긴 항목은 관리자만 되살릴 수 있습니다.</p>
      <div class="row">
        <button class="btn-ghost" id="btnHideNo" type="button">취소</button>
        <button class="btn-danger" id="btnHideYes" type="button">숨기기</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="rotate" id="rotate">휴대폰을 세로로 돌려 주세요</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
