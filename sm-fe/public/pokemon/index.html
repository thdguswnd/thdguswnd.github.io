<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>포켓몬스터 · 결혼 배틀</title>
  <link rel="stylesheet" href="styles/game.css" />
</head>
<body>
  <div id="viewport">
    <div id="screen">

      <!-- ===== 인트로 장면 (오박사 → 신랑/신부 선택 → 확인) ===== -->
      <div id="scene-intro" class="scene">
        <div class="platform"></div>
        <div id="char-slot" class="sprite-wrap"></div>
        <div id="choice-box" class="choice-box hidden"></div>
        <div id="yesno-box" class="yesno-box hidden"></div>
      </div>

      <!-- ===== 배틀 장면 ===== -->
      <div id="scene-battle" class="scene hidden">
        <div class="battle-bg" id="battle-bg"></div>
        <div class="b-platform enemy"></div>
        <div class="b-platform ally"></div>

        <div id="enemy-hp-box" class="hp-box enemy hidden-v">
          <div class="hp-top">
            <span id="enemy-hp-name" class="hp-name"></span>
            <span class="hp-gender">♂</span>
            <span class="hp-level">Lv.5</span>
          </div>
          <div class="hp-row"><span class="hp-label">HP</span>
            <div class="hp-track"><div id="enemy-hp-fill" class="hp-fill"></div></div></div>
        </div>

        <div id="enemy-area" class="enemy-area sprite-wrap"></div>
        <div id="ally-area" class="ally-area sprite-wrap"></div>

        <div id="ally-hp-box" class="hp-box ally hidden-v">
          <div class="hp-top">
            <span id="ally-hp-name" class="hp-name"></span>
            <span class="hp-gender">♂</span>
            <span class="hp-level">Lv.5</span>
          </div>
          <div class="hp-row"><span class="hp-label">HP</span>
            <div class="hp-track"><div id="ally-hp-fill" class="hp-fill"></div></div></div>
          <div id="ally-hp-value" class="hp-value">20 / 20</div>
          <div class="exp-row"><span>EXP</span><i></i></div>
        </div>
      </div>

      <!-- ===== 엔딩 장면 (신랑·신부 나란히) ===== -->
      <div id="scene-ending" class="scene hidden">
        <div id="couple-left" class="couple sprite-wrap"></div>
        <div id="couple-right" class="couple sprite-wrap"></div>
      </div>

      <!-- ===== 공용 하단 대화창 (내레이션) ===== -->
      <div id="dialog-box" class="dialog-box hidden">
        <span id="dialog-text" class="dialog-text"></span>
        <span id="dialog-arrow" class="dialog-arrow"></span>
      </div>

      <!-- ===== 배틀 명령 바 (좌: 프롬프트 / 우: 4보기) — 스샷1 ===== -->
      <div id="cmd-bar" class="cmd-bar hidden">
        <div class="cmd-prompt" id="cmd-prompt">무엇을 물어볼까?</div>
        <div id="move-menu" class="move-menu"></div>
      </div>

      <!-- ===== 엔딩 팝업 (재시작 / 종료) ===== -->
      <div id="end-menu" class="choice-box hidden"></div>

      <!-- ===== 전환 연출 오버레이 ===== -->
      <div id="fx-flash"></div>
      <div id="fx-black"></div>
      <div id="fx-white"></div>

    </div>
  </div>

  <script src="scripts/data.js"></script>
  <script src="scripts/sprites.js"></script>
  <script src="scripts/game.js"></script>
</body>
</html>
